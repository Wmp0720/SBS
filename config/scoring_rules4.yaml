  - 5简略_2.拓展过少：仅给出结论或简单答案，没有对相关概念、原理、原因等进行适当解释
  - 5简略_3.表达过于精简：多个部分缺乏过渡衔接，表达过于精简
  - 5简略_4.内容多样性不足：回答出问题内容，但表达角度较为单一，缺乏多样性
  - 5简略_5.其他：回答内容简略，但是不是上述原因引起的
